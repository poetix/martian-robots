[versions]
kotlin = "2.4.21"
kotest = "6.2.6"
archunit = "1.5.1"
pitest = "1.30.1"
gradle-pitest = "1.19.0"

[libraries]
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-extensions-pitest = { module = "io.kotest:kotest-extensions-pitest", version.ref = "kotest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
pitest = { id = "info.solidsoft.pitest", version.ref = "gradle-pitest" }
